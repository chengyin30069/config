background {
    monitor =
    path = /home/linus/圖片/101068760_p0.jpg
	blur_size = 6
	blur_passes = 2
	brightness = 0.72
}

input-field {
    monitor =
    size = 400, 100
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(61E9FF)
    inner_color = rgba(11, 13, 21, 0.74)
    font_color = rgb(E9FBF8)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(A6F2C2)
    fail_color = rgb(FF6B78) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = rgb(FF6FAC)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -80
    halign = center
    valign = center
}

# Media control: the icon mirrors Waybar's MPRIS play/pause state.
shape {
    monitor =
    size = 52, 52
    color = rgba(34, 38, 54, 0.82)
    rounding = -1
    border_size = 2
    border_color = rgba(97, 233, 255, 0.58)
    position = -40, 40
    halign = right
    valign = bottom
    shadow_passes = 4
    shadow_size = 8
    onclick = playerctl play-pause
}

label {
    monitor =
    text = cmd[update:500] sh -c 'case "$(playerctl status 2>/dev/null)" in Playing) printf "";; *) printf "";; esac'
    color = rgb(97, 233, 255)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = -56, 43
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 5
    onclick = playerctl play-pause
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgba(233, 251, 248, 0.95)
    font_size = 300
    font_family = JetBrainsMono
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    #battery
    text = cmd[update:30000] sh -c 'bat=$(find /sys/class/power_supply -maxdepth 1 -name "BAT*" | head -n 1); if [ -n "$bat" ]; then printf "BAT %s%% %s" "$(cat "$bat/capacity")" "$(cat "$bat/status")"; else printf "BAT N/A"; fi'
    color = rgba(166, 242, 194, 0.92)
    font_size = 24
    font_family = JetBrainsMono
    position = 40, 40
    halign = left
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

